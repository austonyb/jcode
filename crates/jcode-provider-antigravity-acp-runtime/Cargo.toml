[package]
name = "jcode-provider-antigravity-acp-runtime"
version = "0.1.0"
edition = "2024"
publish = false
description = "Antigravity CLI provider for jcode that sends every prompt through `agy acp` (Agent Client Protocol over stdio)"

[lib]
name = "jcode_provider_antigravity_acp_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
# default-features = false: see jcode-provider-cursor-runtime/Cargo.toml.
jcode-base = { path = "../jcode-base", default-features = false }
jcode-message-types = { path = "../jcode-message-types" }
jcode-provider-core = { path = "../jcode-provider-core" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "process", "io-util", "macros"] }
tokio-stream = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
